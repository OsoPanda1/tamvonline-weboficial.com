name: TAMV quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate application and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Set up Python for static HTML validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate institutional HTML artifacts
        run: pnpm validate:site
      - name: Validate App Router registry requirements
        run: pnpm validate:app
      - name: TypeScript checks
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: Smoke-test production routes and VETRA access gate
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3210 > /tmp/tamv-next-start.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:3210 pnpm smoke:routes
